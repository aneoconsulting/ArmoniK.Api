name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-versions:
    name: Verify Versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - run: npm i -g pnpm @antfu/ni

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: nci

      - name: Verify Versions
        run: nr verify-versions

  check-symlinks:
    name: Check symlinks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: The repository's symlinks must still be symlinks
        run: ./scripts/check-symlinks.sh

  format-csharp:
    name: Format C#
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          submodules: true

      - name: Install .NET Core
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4
        with:
          dotnet-version: |
            6.x
            8.x

      - name: Install ReSharper
        run: |
          dotnet tool install -g JetBrains.ReSharper.GlobalTools --version 2024.3.9

      - name: Restore
        run: |
          cd packages/csharp
          dotnet restore ArmoniK.Api.sln

      - name: Reformat
        run: |
          cd packages/csharp
          jb cleanupcode --profile="Full Cleanup With Headers" ArmoniK.Api.sln

      - name: Check Diff
        run: |
          DIFF="$(git diff --name-only)"

          if [ -z "$DIFF" ]; then
            echo "OK: Format is clean"
          else
            echo "Error: Format was not clean"
            echo "List of files:"
            echo "$DIFF"
            git diff
            exit 1
          fi

      - name: Generate patch
        if: ${{ failure() && steps.check-diff.conclusion == 'failure' }}
        run: |
          git diff > patch-csharp.diff

      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        if: ${{ failure() && steps.check-diff.conclusion == 'failure' }}
        with:
          name: patch-csharp
          path: ./patch-csharp.diff

  format-python:
    name: Check linting, formatting and typing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: pip update and add build package
        run: bash proto2python.sh ~/pyvenv

      - name: Install dependencies
        run: |
          source ~/pyvenv/bin/activate
          python -m pip install uv
          python -m uv pip install "$(echo pkg/armonik*.whl)[dev]"

      - name: Lint
        run: |
          source ~/pyvenv/bin/activate
          python -m ruff check .

      # - name: Check typing
      #  run: |
      #  source ~/pyvenv/bin/activate
      #  python -m mypy --exclude src/armonik/protogen/ src/

      - name: Check format
        run: |
          source ~/pyvenv/bin/activate
          python -m ruff format .

      - name: Check Diff
        run: |
          DIFF="$(git diff --name-only)"

          if [ -z "$DIFF" ]; then
            echo "OK: Format is clean"
          else
            echo "Error: Format was not clean"
            echo "List of files:"
            echo "$DIFF"
            git diff
            exit 1
          fi

  format-cpp:
    name: Format C++
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Run clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check Diff
        id: check-diff
        run: |
          cd packages/cpp
          git ls-files *.{c,h,hpp,cpp,cc} | xargs clang-format -style=file:.clang-format -i
          DIFF="$(git diff --name-only)"

          if [ -z "$DIFF" ]; then
          echo "OK: Format is clean"
          else
            echo "Error: Format was not clean"
            echo "List of files:"
            echo "$DIFF"
            git diff
            exit 1
          fi

      - name: Generate patch
        if: ${{ failure() && steps.check-diff.conclusion == 'failure' }}
        run: |
          git diff > patch-cpp.diff
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        if: ${{ failure() && steps.check-diff.conclusion == 'failure' }}
        with:
          name: patch-cpp
          path: ./patch-cpp.diff

  format-protobuf:
    name: Format Protobuf
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          submodules: true

      - name: Check Diff
        run: docker run --rm --volume "$(pwd)/Protos/V1:/workspace" --workdir /workspace bufbuild/buf:1.8.0 format -d --exit-code

  format-rust:
    name: Format and check Rust
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - nightly
    runs-on: ubuntu-latest
    defaults:
      run:
        # The workspace root, so every `--workspace` below covers both members rather than just one.
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@019e22100565643c6890fe3f00da0b63017c1672 # v2
        with:
          tool: sccache
      - name: Install toolchain
        if: ${{ !contains(matrix.toolchain, 'nightly') }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src,rust-docs,rustfmt,clippy
      - name: Build
        run: |
          cargo build --workspace --locked
      - name: Format
        run: |
          cargo fmt --all --check
      - name: Doc
        # `--document-private-items`, because a broken intra-doc link in a private item is still a
        # broken link, and the crates that carry the design prose are mostly private.
        run: |
          RUSTDOCFLAGS="-Dwarnings" cargo doc --workspace --no-deps --all-features \
            --document-private-items
      - name: Clippy
        # Two invocations on purpose. `-Dunused-crate-dependencies` is per *target*, and a test
        # target links its whole package's dev-dependencies, so on `--all-targets` it reports every
        # dependency that one test file happens not to name: a dozen false positives in
        # `armonik-transport` alone. So the dependency lint runs over the shipped targets, and
        # `--all-targets` runs everything else over the tests and benches too, which is where the
        # unused imports and the bench-only lints live.
        run: |
          cargo clippy --workspace --all-features --no-deps -- -Dwarnings -Dunused-crate-dependencies
          cargo clippy --workspace --all-features --all-targets --no-deps -- -Dwarnings

  features-rust:
    name: Check Rust feature configurations
    # The gate above runs once, with every feature on. That is the one configuration nobody ships:
    # the four use-case features are alternatives, and a user normally picks exactly one. Each of
    # these is a configuration someone can actually select, and the crate checks in about three
    # seconds, so covering them all costs less than the one build above.
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - serde
          - client
          - server
          - agent
          - worker
          - client,server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@019e22100565643c6890fe3f00da0b63017c1672 # v2
        with:
          tool: sccache
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: |
          cargo clippy -p armonik --locked --no-default-features --features "${{ matrix.features }}" \
            --no-deps -- -Dwarnings -Dunused-crate-dependencies

  lint-js:
    name: Lint JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - run: npm install -g pnpm @antfu/ni

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: nci

      - run: nr lint

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - run: npm i -g pnpm @antfu/ni

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: nci

      - name: Install Protoc
        uses: taiki-e/install-action@019e22100565643c6890fe3f00da0b63017c1672 # v2
        with:
          tool: protoc

      - name: Build protos
        run: nr proto:generate:linux

      - name: Build
        run: nr build

  build-angular:
    name: Build Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/angular
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - run: npm i -g pnpm @antfu/ni

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: nci

      - name: Install Protoc
        uses: taiki-e/install-action@019e22100565643c6890fe3f00da0b63017c1672 # v2
        with:
          tool: protoc

      - name: Build protos
        run: nr proto:generate:linux

      - name: Build
        run: nr build

  build-cpp-packages:
    strategy:
      fail-fast: false
      matrix:
        type: [tar.gz, deb, rpm]
    name: Build C++ Packages [${{ matrix.type }}]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.ref }}

      - name: Build the package
        run: |
          cd packages/cpp/tools/packaging
          ./make-${{ matrix.type }}.sh
      - name: Publish package as artefact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          if-no-files-found: error
          path: packages/cpp/tools/packaging/*.${{ matrix.type }}
          name: libarmonik.${{ matrix.type }}

  build-java-packages:
    name: Build Java
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/java
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Set up java 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build the package
        run: ./mvnw clean verify
