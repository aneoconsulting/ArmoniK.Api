syntax = "proto3";

package armonik.ffi.shapes.v1;

// This slice's own file, in this slice's own directory: `ffi/schema/generated/shapes.proto`
// is frozen by W2 and is imported rather than edited. The RPC arm of design/SHAPES.md needs
// one unary method carrying a real payload (P2.2), and nothing else.
import "shapes.proto";

service Shapes {
  // Small request, P2.2-sized response: 540 KB. R9's hazard is reachable here IF the
  // stream window is small, which is a property of a stack's default and not of HTTP/2 --
  // `logs/cpp/rpcflow.log` establishes what each of the two stacks here actually does.
  rpc Fetch(Empty) returns (ListTasksDetailedResponse);
  // Zero fields in and zero fields out. It exists for R5: the crossing count per RPC is
  // claimed to be a property of the code rather than a function of field count, and one
  // method with ~4,500 fields beside one with none is how that is COUNTED rather than
  // argued from reading `rpc.rs`.
  rpc Ping(Empty) returns (Empty);
  // design/CAMPAIGN.md requirement 14, direction (b): a P2.2-sized REQUEST that the server
  // decodes, and an empty response. The campaign server implements it (and Fetch) as raw
  // byte methods, so its work is identical whichever client cell called.
  rpc Push(ListTasksDetailedResponse) returns (Empty);
  // Requirement 14 direction (c), required 2026-09-27: a unary upload, request P5.3 or
  // P5.4 (M5, 1 MB and 4 MB) that the server decodes, empty response.
  rpc Upload(UploadResultDataMessage) returns (Empty);
  // Requirement 14 direction (d): the streamed upload in ArmoniK's
  // UploadResultData(stream ...) shape, M5 messages carrying 2 MiB chunks (the ids on the
  // first only). The server decodes every message and answers the data byte count and the
  // SHA-256 of every message's bytes as received; the client checks both.
  rpc UploadStream(stream UploadResultDataMessage) returns (UploadAck);
}

message UploadAck {
  fixed64 data_bytes = 1;
  bytes sha256 = 2;
}
