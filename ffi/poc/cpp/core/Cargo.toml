[package]
name = "ak-core-cpp"
edition = "2021"
rust-version = "1.88"
version = "0.0.0"
publish = false

[lib]
name = "ak_core_cpp"
# BOTH linkages, from one source, in one build. The cdylib is the primary arm (comparable
# with the rust slice's 1.8 ns crossing through a cdylib); the staticlib is the second,
# separately labelled arm, and it is where R5's inlining hazard bites -- a C++ host that
# statically links and turns on -flto can inline the entry point away, counters included.
crate-type = ["cdylib", "staticlib"]

[features]
default = []
count = ["ak-rt/count"]
dec-reject = ["ak-rt/dec-reject"]
dec-reject-simd = ["ak-rt/dec-reject-simd"]
rpc = ["dep:rpc", "dep:tonic", "dep:tokio", "dep:bytes", "dep:http"]

[dependencies]
# Read-only path dependencies on the rust slice's hand-written runtime. Not copied: one
# definition of the ABI structs and one Enc/Dec runtime, so the two slices cannot drift.
ak-abi = { path = "../../rust/crates/ak-abi" }
ak-rt  = { path = "../../rust/crates/ak-rt" }
simdutf8 = "0.1"
rpc    = { path = "../../rust/crates/rpc", optional = true }
tonic  = { version = "0.14", default-features = false, features = ["codegen", "transport"], optional = true }
tokio  = { version = "1.52", default-features = false, features = ["rt-multi-thread", "net", "time"], optional = true }
bytes  = { version = "1", optional = true }
http   = { version = "1", optional = true }

[profile.release]
# Explicit rather than defaulted, because R5's hazard is exactly "what is the optimiser
# allowed to do across the boundary". lto=false here means the CORE is not LTO'd into
# itself across crates; what matters for the hazard is the C++ side's -flto over the
# staticlib, which the CMake build controls and `gen/boundary.sh` checks.
lto = false
