[package]
name = "harness"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = ["guard"]
# ABI v1 section 5. On by default, because every published managed figure was taken
# WITHOUT it and this slice is not going to repeat that.
guard = []
# README R5: the counting build.
count = ["ak-rt/count", "ak-core/count"]
# ABI v1 open decision 3 (third framing): the decode side's UTF-8 policy.
# Default = lossy. These two make decode validate and REJECT.
dec-reject = ["ak-rt/dec-reject"]
dec-reject-simd = ["ak-rt/dec-reject-simd"]
# ABI v1 obligation 12.5 and section 6: the process-global learned-width table, which
# section 6 refuses. Built so the refusal is measured rather than inherited.
global-widths = ["ak-rt/global-widths", "ak-core/global-widths"]
# ABI v1 section 3's "every entry point requires ak_init", as an arm, so what it costs on
# the hot path is a number rather than a claim.
init-guard = ["ak-core/init-guard"]

[dependencies]
# Build-ordering and feature plumbing only. `ak-core` is a cdylib: it is linked by
# build.rs through the dynamic linker, never `use`d, so nothing here can inline it.
# R0: the shared core. `features = ["rpc"]` because ABI v1 section 9 is behind a
# feature now that three slices build this crate and only this one links tonic into
# it; before the move the module was unconditional, so this keeps the artifact the
# same as the one every figure in ffi/logs/rust was taken against.
ak-core = { path = "../../../codec/crates/ak-core", features = ["rpc"] }
facade = { path = "../facade" }
shapes-prost = { path = "../shapes-prost" }
shapes-values = { path = "../shapes-values" }
stage1-validate = { path = "../stage1-validate" }
ak-abi = { path = "../../../codec/crates/ak-abi" }
ak-rt = { path = "../../../codec/crates/ak-rt" }
prost.workspace = true
bytes.workspace = true
sha2.workspace = true
serde_json.workspace = true
rpc = { path = "../../../codec/crates/rpc" }
tonic = { workspace = true, features = ["codegen", "transport"] }
tonic-prost.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "time"] }
http.workspace = true
# Section 4 only: a provably COMPLETE string corpus, harvested by reflection rather than
# by hand, so "every string field" is a fact about the descriptor and not a claim.
prost-reflect = "0.16"
# Section 4 only: the three policies priced side by side IN ONE PROCESS, which the
# build-time cfg cannot do.
simdutf8.workspace = true

[build-dependencies]

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"

[[bin]]
name = "rpcbench"
path = "src/bin/rpcbench.rs"

[[bin]]
name = "shapes"
path = "src/bin/shapes.rs"

[[bin]]
name = "content"
path = "src/bin/content.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "counts"
path = "src/bin/counts.rs"

[[bin]]
name = "decpolicy"
path = "src/bin/decpolicy.rs"

[[bin]]
name = "inlining"
path = "src/bin/inlining.rs"

[[bin]]
name = "zeroed"
path = "src/bin/zeroed.rs"

[[bin]]
name = "unknown"
path = "src/bin/unknown.rs"

[[bin]]
name = "pullbench"
path = "src/bin/pullbench.rs"

[[bin]]
name = "concur"
path = "src/bin/concur.rs"

[[bin]]
name = "lifecycle"
path = "src/bin/lifecycle.rs"

[[bin]]
name = "guardcost"
path = "src/bin/guardcost.rs"
