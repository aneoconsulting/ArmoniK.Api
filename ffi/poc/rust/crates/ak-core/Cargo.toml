[package]
name = "ak-core"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[lib]
# A cdylib, and NOT an rlib. With an rlib in the crate graph rustc inlines the `extern "C"`
# entry points straight into the host -- measured: zero call sites to
# ak_encode_ListResultsResponse in the release binary, with the counters still incrementing
# because the inlined body still contains them. A cdylib is resolved by the dynamic linker,
# so the call cannot be inlined and it is what every managed host actually does: load a
# shared library. See JOURNAL.md, stage 2.
crate-type = ["cdylib"]

[features]
default = []
# README R5. Propagated to ak-rt so the counters live in the contexts.
count = ["ak-rt/count"]

[dependencies]
ak-abi = { path = "../ak-abi" }
ak-rt = { path = "../ak-rt" }
simdutf8.workspace = true
