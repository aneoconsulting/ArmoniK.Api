[package]
name = "corpus-facade"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[lib]
# The generated binding says `use facade::*;`, as it does in the shapes.json harness.
name = "facade"

[features]
# Optimisation step 8 (F1): see poc/rust/crates/facade/Cargo.toml.
default = ["unknown-fields"]
unknown-fields = []

[dependencies]
ak-rt = { path = "../../../../codec/crates/ak-rt" }
bytes = "1"
serde_json = "1"
