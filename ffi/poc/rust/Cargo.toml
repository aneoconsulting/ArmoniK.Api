[workspace]
resolver = "2"
# R0: ak-abi, ak-rt, ak-core and rpc were members here and are now the shared core at
# `poc/codec/`. They are reached by path, like every other slice reaches them; what is
# left in this workspace is what is this slice's own -- its facade, its harness, its
# prost arms and its stage-1 validator.
members = ["crates/shapes-prost", "crates/shapes-values", "crates/stage1-validate", "crates/facade", "crates/harness"]

[workspace.package]
edition = "2021"
# README section 5: for Rust the floor IS the target. One configuration, pinned to the
# workspace MSRV of packages/rust.
rust-version = "1.88"
version = "0.0.0"
publish = false

[workspace.dependencies]
prost = "0.14"
prost-build = "0.14"
protox = "0.9"
sha2 = "0.10"
# A SIMD UTF-8 validator, used by ONE transcoder arm to separate "validation costs this"
# from "Rust's scalar validator costs this". See ffi/logs/rust/stage3-content-sets.log.
simdutf8 = "0.1"
serde_json = "1"
bytes = "1"
# Stage 4, the RPC arm. Versions matched to packages/rust's workspace so the incumbent this
# slice measures against is the one ArmoniK ships.
tonic = { version = "0.14", default-features = false }
tonic-prost = "0.14"
tokio = { version = "1.52", default-features = false }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = "1.10"
hyper-util = "0.1"
tower-service = "0.3"
