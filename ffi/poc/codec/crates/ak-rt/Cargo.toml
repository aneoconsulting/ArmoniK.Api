[package]
name = "ak-rt"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[features]
# Optimisation step 11 (C2): the decoder's UTF-8 check (`strings::check_utf8`, what every
# `string` field goes through under the plan's utf8="reject") uses simdutf8. A DEFAULT
# feature of THIS crate rather than of ak-core, because ak-core depends on ak-rt with its
# default features: every slice's core build gets it whatever it passes to ak-core
# (several build ak-core --no-default-features or with an explicit feature list).
default = ["simd-utf8"]
simd-utf8 = ["dep:simdutf8"]
# README R5: a counting build, so a crossing count is counted and not inferred.
count = []
# ABI v1 open decision 3: the decode side's UTF-8 policy. Default is lossy, which is what a
# facade written the obvious way does and what proto3 says a parser must not do.
dec-reject = []
dec-reject-simd = ["dep:simdutf8"]
# ABI v1 section 6: "The table lives in the context, never process-global."  This feature
# builds the arrangement that sentence REFUSES -- one learned-width table for the whole
# process -- so the refusal can be measured instead of inherited.  It is OFF by default and
# no slice's normal build turns it on; the default build is byte-for-byte the code that was
# there before it existed.  Added by the rust slice for its concurrency suite (obligation
# 12.5), which is the first thing in the branch to run the codec on more than one thread.
#
# `Mark` still carries its own width by value, so the BYTES stay correct under this feature
# and the two arms remain comparable: what it exposes is contention, which is what section
# 6's claim is about.  A table that were also re-read at `end()` would be a correctness
# defect as well, and the suite's positive control covers that class separately.
global-widths = []
# ABI v1 section 6's OTHER refusal, and the one that corrupts BYTES: pad the length prefix
# to the learned width instead of moving the body. Legal wire, and refused because the
# encoder's output then depends on its own history. TEST-ONLY, like `global-widths`: it is
# not an option a host may pick, and it exists so obligation 12.5's suite has a plant that
# produces WRONG BYTES rather than only one that aborts. The two refusals are independent
# and only their combination is the worst case -- see ffi/logs/cpp/concurrency.log, which
# separated them, and section 6, which was rewritten to say so.
pad-widths = []

[dependencies]
simdutf8 = { workspace = true, optional = true }
# Optimisation T1: `Enc`'s buffer is a `BytesMut`, so a transport-ready `Bytes` is a split
# and a freeze (O(1)) rather than a copy. Already in every core build's graph through tonic.
bytes = { workspace = true }
