[package]
name = "ak-core"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "ak_core"
# A cdylib and a staticlib, and NOT an rlib. With an rlib in the crate graph rustc inlines
# the `extern "C"` entry points straight into a Rust host -- measured: zero call sites to
# ak_encode_ListResultsResponse in the release binary, with the counters still incrementing
# because the inlined body still contains them. A cdylib is resolved by the dynamic linker,
# so the call cannot be inlined and it is what every managed host actually does: load a
# shared library. The staticlib is the cpp slice's second, separately labelled arm, and it
# is where R5's inlining hazard bites -- a C++ host that statically links and turns on
# -flto can inline the entry point away, counters included. Emitting both from one build
# is what makes "shared" and "static" two linkages of ONE core rather than two cores.
crate-type = ["cdylib", "staticlib"]

[features]
# WP5 step 10: decision 11's unknown-field support (capture, options, re-emission). OFF is
# the NO-UNKNOWN variant, support compiled out (plan: THE NO-UNKNOWN VARIANT). A dependent
# that turns it off must depend on ak-core AND ak-abi with `default-features = false`.
default = ["unknown-fields"]
unknown-fields = ["ak-abi/unknown-fields"]
# README R5: the counting build. Propagated to ak-rt so the counters live in the contexts.
count = ["ak-rt/count"]
# ABI v1 open decision 3: the decode side's UTF-8 policy. Default is lossy, which is what a
# facade written the obvious way does and what proto3 says a parser must not do.
dec-reject = ["ak-rt/dec-reject"]
dec-reject-simd = ["ak-rt/dec-reject-simd"]
# ABI v1 section 6's refused arrangement, for the rust slice's concurrency suite. Off by
# default; see ak-rt's manifest for what it is and why it exists.
global-widths = ["ak-rt/global-widths"]
pad-widths = ["ak-rt/pad-widths"]
# ABI v1 section 3: "Every other entry point requires `ak_init` to have returned
# successfully, the codec included." Behind a feature so the claim can be PRICED -- with
# it off, the emitted entry points are byte-for-byte what they were.
init-guard = []
# Test-only: the core generated for ffi/corpus's reader schema, so the corpus runs through
# the C ABI (FIX-PLAN WP5 item 6.1). Changes the ABI: enabled only by `poc/rust/corpus/`,
# a workspace of its own, never together with a shapes.json host.
corpus = ["ak-abi/corpus"]
# s13 (owner, 2026-10-09), MEASUREMENT ONLY, default OFF (the default build is simdutf, D19):
# the encode-side UTF-16 -> UTF-8 transcoder (`ak_tc_utf16`, and the additive
# `ak_utf16_to_utf8`, which share `utf16_to_utf8_into`) in plain scalar Rust instead of
# simdutf. `tc-scalar-naive`: the pre-D19 writer (`utf16_write_replacing`, after the scalar
# count when the buffer is under the worst case); `tc-scalar-word`: a scalar writer with an
# ASCII word fast path (`utf16_write_word`). At most one of them. Validation, lengths and
# every decode path are unchanged.
tc-scalar-naive = []
# s14 (owner, 2026-10-10), MEASUREMENT ONLY, default OFF: rungs of the E0 -> E1R ladder.
# `tc-measure-generic`: `ak_tc_bytes()` returns an identity UTF-8 copy that is NOT the trusted
# passthrough, so a host's UTF-8 strings take the GENERIC transcoder path (learned-width
# placeholder, indirect call, room check, length resolved after) instead of the one-pass memcpy.
# `tc-measure-u16stub`: `ak_tc_utf16()` returns a stub that copies `len` raw bytes (no
# transcoding: its output is WRONG, a timing control only) and the build exports
# `ak_measure_tc_stub` so a host can refuse to call it correct.
tc-scalar-word = []
tc-measure-generic = []
tc-measure-u16stub = []
# ABI v1 section 9, behind a feature so a codec arm does not link tonic and tokio into the
# shared object it is timing. The rust slice turns it on; the cpp slice turns it on for its
# RPC arm only; the java and csharp slices do not have one.
rpc = ["dep:rpc", "dep:tonic", "dep:tokio", "dep:bytes", "dep:http"]

[dependencies]
ak-abi = { path = "../ak-abi", default-features = false }
ak-rt = { path = "../ak-rt" }
simdutf8.workspace = true
simdutf.workspace = true
rpc = { path = "../rpc", optional = true }
tonic = { workspace = true, features = ["codegen", "transport"], optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "macros"], optional = true }
bytes = { workspace = true, optional = true }
http = { workspace = true, optional = true }
