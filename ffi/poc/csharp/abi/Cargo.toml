# The layout probe (FIX-PLAN WP5 step 4, R-E6).
#
# C# declares every ABI struct a second time (a `[StructLayout(Sequential)]` struct whose
# first declaration is Rust's), so only agreement of the two makes the by-value groups
# work. This prints the RUST declaration's layout -- every repr(C) struct of ak-abi, every
# member's name, offset and size, as the Rust compiler lays it out -- and the C# harness
# (`harness layout`) compares it with the C# declaration by NAME, both ways.
#
# src/main.rs is emitted by ffi/poc/codec/gen/cs_layout_probe.py, which parses the struct
# and member lists out of ak-abi's Rust SOURCE TEXT. It reads no plan: the earlier probe
# was emitted from the same field list the C# structs were, so it could not see a member
# missing from both, and it checked sizes only (R-E6).
#
#   cargo run --release                      the shapes ABI
#   cargo run --release --features corpus    the corpus-schema ABI
[package]
name = "ak-layout-probe"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ak-layout-probe"
path = "src/main.rs"

[features]
corpus = ["ak-abi/corpus"]

[dependencies]
ak-abi = { path = "../../codec/crates/ak-abi" }

[workspace]
