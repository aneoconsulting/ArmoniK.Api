syntax = "proto3";

package armonik.ffi.shapes.v1;

// Added by ffi/poc/java/gen/run_all.sh when it copies
// ffi/schema/generated/shapes.proto: java_package and
// java_multiple_files change generated Java names and nothing on the wire.
option java_package = "ak.pb";
option java_multiple_files = true;
option java_outer_classname = "ShapesProto";

// Generated from shapes.json by emit/proto.py. Do not edit.
// The well-known types are copied rather than imported, so this file has no
// include path to get right in five toolchains.

enum ResultStatus {
  RESULT_STATUS_UNSPECIFIED = 0;
  RESULT_STATUS_CREATED = 1;
  RESULT_STATUS_COMPLETED = 2;
  RESULT_STATUS_ABORTED = 3;
  RESULT_STATUS_DELETED = 4;
  RESULT_STATUS_NOTFOUND = 127;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_CREATING = 1;
  TASK_STATUS_SUBMITTED = 2;
  TASK_STATUS_DISPATCHED = 3;
  TASK_STATUS_COMPLETED = 4;
  TASK_STATUS_ERROR = 5;
  TASK_STATUS_TIMEOUT = 6;
  TASK_STATUS_CANCELLING = 7;
  TASK_STATUS_CANCELLED = 8;
  TASK_STATUS_PROCESSING = 9;
  TASK_STATUS_PROCESSED = 10;
  TASK_STATUS_RETRIED = 11;
  TASK_STATUS_PENDING = 12;
  TASK_STATUS_PAUSED = 13;
}

enum ProbeKind {
  PROBE_KIND_UNSPECIFIED = 0;
  PROBE_KIND_ALPHA = 1;
  PROBE_KIND_BETA = 2;
}

// google.protobuf.Timestamp, copied rather than imported
message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

// google.protobuf.Duration, copied rather than imported
message Duration {
  int64 seconds = 1;
  int32 nanos = 2;
}

// Protos/V1/results_common.proto, tags preserved including the gap at 7
message ResultRaw {
  string session_id = 1;
  string name = 2;
  string owner_task_id = 3;
  ResultStatus status = 4;
  Timestamp created_at = 5;
  Timestamp completed_at = 6;
  string result_id = 8;
  int64 size = 9;
  string created_by = 10;
  bytes opaque_id = 11;
  bool manual_deletion = 12;
}

// Protos/V1/objects.proto
message TaskOptions {
  map<string, string> options = 1;
  Duration max_duration = 2;
  int32 max_retries = 3;
  int32 priority = 4;
  string partition_id = 5;
  string application_name = 6;
  string application_version = 7;
  string application_namespace = 8;
  string application_service = 9;
  string engine_type = 10;
}

// Protos/V1/tasks_common.proto, TaskDetailed.Output, hoisted out of its parent
message TaskOutput {
  bool success = 1;
  string error = 2;
}

// Protos/V1/tasks_common.proto, tags preserved
message TaskDetailed {
  string id = 1;
  string session_id = 2;
  string owner_pod_id = 3;
  repeated string parent_task_ids = 4;
  repeated string data_dependencies = 5;
  repeated string expected_output_ids = 6;
  repeated string retry_of_ids = 7;
  TaskStatus status = 8;
  string status_message = 9;
  TaskOptions options = 10;
  Timestamp created_at = 11;
  Timestamp submitted_at = 12;
  Timestamp started_at = 13;
  Timestamp ended_at = 14;
  Timestamp pod_ttl = 15;
  TaskOutput output = 16;
  string pod_hostname = 17;
  Timestamp received_at = 18;
  Timestamp acquired_at = 19;
  Duration creation_to_end_duration = 20;
  Duration processing_to_end_duration = 21;
  string initial_task_id = 22;
  Duration received_to_end_duration = 23;
  Timestamp processed_at = 24;
  Timestamp fetched_at = 25;
  string payload_id = 26;
  string created_by = 27;
}

// Protos/V1/tasks_common.proto, reduced to the fields the adapter site needs
message TaskSummary {
  string id = 1;
  string session_id = 2;
  TaskOptions options = 3;
  TaskStatus status = 4;
  Timestamp created_at = 5;
  string error = 8;
  string status_message = 9;
  int64 count_data_dependencies = 11;
}

// invented; both shapes are real, the schema has 19 oneofs in 413 fields
message Probe {
  string id = 1;
  optional int32 opt_count = 2;
  optional string opt_label = 3;
  optional bool opt_flag = 4;
  oneof body {
    int64 as_int = 10;
    string as_text = 11;
    bytes as_blob = 12;
    Timestamp as_stamp = 13;
    Empty as_nothing = 14;
  }
}

// Protos/V1/objects.proto
message Empty {
}

// adapted from UploadResultDataRequest: flattened out of its oneof stream so that one message carries the bulk field
message UploadResultData {
  string session_id = 1;
  string result_id = 2;
  bytes data_chunk = 3;
}

// invented. The four scalar packed fields are a CONTROL: the real schema has 3 packed repeated fields and all of them are enums. `statuses` is the real shape, relocated: every packed field in Protos/V1 sits on a filter or request message (submitter_common.proto `repeated task_status.TaskStatus statuses`, results_common.proto `repeated result_status.ResultStatus fetch_statuses`), and this payload set carries responses only. So M6's scalar rows are a control and its enum row is not.
message MetricsBatch {
  string id = 1;
  repeated int64 ticks = 2;
  repeated double values = 3;
  repeated int32 codes = 4;
  repeated bool flags = 5;
  repeated TaskStatus statuses = 6;
}

// invented, the element of M7
message Pair {
  string key = 1;
  int32 value = 2;
}

message ListResultsResponse {
  repeated ResultRaw results = 1;
  int32 page = 2;
  int32 total = 3;
}

message ListTasksDetailedResponse {
  repeated TaskDetailed tasks = 1;
  int32 page = 2;
  int32 total = 3;
}

message ListTaskSummaryResponse {
  repeated TaskSummary tasks = 1;
}

message ListProbeResponse {
  repeated Probe probes = 1;
}

message ListMetricsResponse {
  repeated MetricsBatch batches = 1;
}

message UploadResultDataMessage {
  UploadResultData upload = 1;
}

// invented. CONTROL: legal wire that no group buffer keyed by type can decode
message DualResponse {
  repeated Pair left = 1;
  repeated Pair right = 2;
}
