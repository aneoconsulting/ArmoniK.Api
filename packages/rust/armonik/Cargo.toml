[package]
authors = ["Florian Lemaitre <flemaitre@aneo.fr>"]
description = "Rust bindings for the ArmoniK API"
edition = "2021"
include = ["**/*.rs", "Cargo.toml", "LICENSE", "README.md", "protos/**"]
license = "Apache-2.0"
readme = "README.md"
name = "armonik"
repository = "https://github.com/aneoconsulting/ArmoniK.Api"
version = "3.29.2-beta-0"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["client"]
serde = ["dep:serde", "bytes/serde", "armonik-transport?/serde"]
client = ["_gen-client"]
server = ["_gen-server"]
agent = ["_gen-client", "_gen-server"]
worker = ["_gen-client", "_gen-server"]
_gen-client = ["tonic/channel", "dep:armonik-transport"]
_gen-server = ["tonic/server", "tonic/router", "dep:tokio"]
# Internal: the derives register every message type into a distributed
# slice for the differential harness, along with its generated `Normalize`
# projection over `prost_reflect::DynamicMessage`. Enabled through the self
# dev-dependency, so tests always see it and downstream builds never do.
_differential = ["dep:linkme", "dep:prost-reflect"]

[dependencies]
# TLS, mTLS and the rest of the connection story live in `armonik-transport`; this crate keeps the
# services and the (in-crate, pre-split) generated types plus their codec.
armonik-transport = { path = "../armonik-transport", optional = true }
bytes = "1"
linkme = { version = "0.3", optional = true }
prost-reflect = { version = "0.16", optional = true }
tonic = { version = "0.14", features = ["codegen"], default-features = false }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
futures = "0.3"
snafu = "0.9"
tracing = "0.1"
tracing-futures = { version = "0.2", features = ["futures-03"] }
tokio = { version = "1.52", default-features = false, optional = true }
serde = { version = "1.0", features = [
  "derive",
  # `std` provides the container impls (HashMap members, e.g. `Count`).
  "std",
], default-features = false, optional = true }
humantime = "2.3.0"

# Internal derive macros; version-locked with this crate.
# The standalone `version` line below is updated by `scripts/update-versions.ts`.
[dependencies.armonik-macros]
path = "../armonik-macros"
version = "=3.29.2-beta-0"

[dev-dependencies]
criterion.workspace = true
armonik = { path = ".", features = ["_differential"] }
# Only the `get_nb_request` test helper needs these: it drives a raw HTTP request through the connector
# `armonik-transport` builds, to read the mock server's `/calls.json`.
hyper = { version = "1.10", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "http1"] }
eyre = "0.6"
prost-reflect = "0.16"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
http-body-util = "0.1"
serde_json = "1.0"
serial_test = "3.5"
async-stream = "0.3"
tokio = { version = "1.48", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  # `test-util` for the paused clock the cancellation tests run on.
  "test-util",
] }
tokio-util = "0.7"

[build-dependencies]
tonic-prost-build = "0.14"
protox = "0.9"
prost-types = "0.14"
prost = "0.14"

[[bench]]
name = "roundtrip"
required-features = ["client", "server"]
harness = false

[[bench]]
name = "wire"
required-features = ["client", "server"]
harness = false
