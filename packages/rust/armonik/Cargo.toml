[package]
authors.workspace = true
description = "Rust bindings for the ArmoniK API"
edition.workspace = true
include = ["**/*.rs", "Cargo.toml", "LICENSE", "README.md", "protos/**"]
license.workspace = true
readme = "README.md"
name = "armonik"
repository.workspace = true
version.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["client"]
serde = ["dep:serde", "armonik-types/serde", "armonik-transport?/serde"]
client = ["_gen-client"]
server = ["_gen-server"]
agent = ["_gen-client", "_gen-server"]
worker = ["_gen-client", "_gen-server"]
_gen-client = ["tonic/channel", "dep:armonik-transport"]
_gen-server = ["tonic/server", "tonic/router", "dep:tokio"]

[dependencies]
# TLS, mTLS and the rest of the connection story live in `armonik-transport`; this crate keeps the
# services and the generated types (which need `bytes` for zero-copy `bytes::Bytes` fields).
armonik-transport = { workspace = true, optional = true }
bytes = "1"
tonic = { workspace = true, features = ["codegen"] }
tonic-prost.workspace = true
prost.workspace = true
prost-types.workspace = true
futures.workspace = true
snafu.workspace = true
tracing.workspace = true
tracing-futures = { workspace = true, features = ["futures-03"] }
tokio = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

# The message-types crate; version-locked with this crate.
# The standalone `version` line below is updated by `scripts/update-versions.ts`.
[dependencies.armonik-types]
path = "../armonik-types"
version = "=3.29.2-beta-0"

[dev-dependencies]
criterion.workspace = true
# Only the `get_nb_request` test helper needs these: it drives a raw HTTP request through the connector
# `armonik-transport` builds, to read the mock server's `/calls.json`.
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["client", "http1"] }
eyre.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
http-body-util.workspace = true
serde_json.workspace = true
serial_test.workspace = true
async-stream.workspace = true
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  # `test-util` for the paused clock the cancellation tests run on.
  "test-util",
] }
tokio-util.workspace = true

[build-dependencies]
# The descriptor and the registry (extern map / replacements / absorbed) are harvested from
# `armonik-types` at build time (the base `_registry` feature enables the slice read here — not
# `_differential`, so `prost-reflect` stays out of this build-script graph); no proto compilation.
armonik-types = { path = "../armonik-types", features = ["_registry"] }
tonic-prost-build.workspace = true
prost-types.workspace = true
prost.workspace = true

[[test]]
name = "agent"
required-features = ["agent", "worker"]

[[test]]
name = "applications"
required-features = ["client", "server"]

[[test]]
name = "auth"
required-features = ["client", "server"]

[[test]]
name = "events"
required-features = ["client", "server"]

[[test]]
name = "partitions"
required-features = ["client", "server"]

[[test]]
name = "results"
required-features = ["client", "server"]

[[test]]
name = "sessions"
required-features = ["client", "server"]

[[test]]
name = "submitter"
required-features = ["client", "server"]

[[test]]
name = "tasks"
required-features = ["client", "server"]

[[test]]
name = "versions"
required-features = ["client", "server"]

[[test]]
name = "worker"
required-features = ["agent", "worker"]

[[bench]]
name = "roundtrip"
required-features = ["client", "server"]
harness = false

[[bench]]
name = "wire"
required-features = ["client", "server"]
harness = false
