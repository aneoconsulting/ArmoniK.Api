[package]
authors.workspace = true
description = "Rust bindings for the ArmoniK API"
edition.workspace = true
include = ["**/*.rs", "Cargo.toml", "LICENSE", "README.md", "protos/**"]
license.workspace = true
readme = "README.md"
name = "armonik"
repository.workspace = true
version.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["client"]
serde = ["dep:serde", "bytes/serde", "armonik-transport?/serde"]
client = ["_gen-client"]
server = ["_gen-server"]
agent = ["_gen-client", "_gen-server"]
worker = ["_gen-client", "_gen-server"]
_gen-client = ["tonic/channel", "dep:armonik-transport"]
_gen-server = ["tonic/server", "tonic/router", "dep:tokio"]
# Internal: the differential harness. Each type's round-trip and `Normalize`
# projection over `prost_reflect::DynamicMessage`, self-registered into the
# `wire::REGISTRY` distributed slice. Enabled through the self dev-dependency,
# so tests always see it and downstream builds never do.
_differential = ["dep:linkme", "dep:prost-reflect"]

[dependencies]
# TLS, mTLS and the rest of the connection story live in `armonik-transport`; this crate keeps the
# services and the generated types (which need `bytes` for zero-copy `bytes::Bytes` fields).
armonik-transport = { workspace = true, optional = true }
bytes = "1"
linkme = { version = "0.3", optional = true }
prost-reflect = { version = "0.16", optional = true }
tonic = { workspace = true, features = ["codegen"] }
tonic-prost.workspace = true
prost.workspace = true
prost-types.workspace = true
futures.workspace = true
snafu.workspace = true
tracing.workspace = true
tracing-futures = { workspace = true, features = ["futures-03"] }
tokio = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

# The derives and `service!`; version-locked with this crate.
# The standalone `version` line below is updated by `scripts/update-versions.ts`.
[dependencies.armonik-macros]
path = "../armonik-macros"
version = "=3.29.2-beta-0"

[dev-dependencies]
criterion.workspace = true
# The differential harness: enabled for tests only, through the self dev-dependency.
armonik = { path = ".", features = ["_differential"] }
prost-reflect = "0.16"
# Only the `get_nb_request` test helper needs these: it drives a raw HTTP request through the connector
# `armonik-transport` builds, to read the mock server's `/calls.json`.
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["client", "http1"] }
http-body-util.workspace = true
serde_json.workspace = true
serial_test.workspace = true
async-stream.workspace = true
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  # `test-util` for the paused clock the cancellation tests run on.
  "test-util",
] }
tokio-util.workspace = true

[build-dependencies]
protox = "0.9"
prost.workspace = true
# Descriptor-fingerprint hash; armonik-macros hashes it with the same crate at
# expansion time, so the two sides cannot diverge (see build.rs).
fnv = "1"

[[test]]
name = "agent"
required-features = ["agent", "worker"]

[[test]]
name = "applications"
required-features = ["client", "server"]

[[test]]
name = "auth"
required-features = ["client", "server"]

[[test]]
name = "events"
required-features = ["client", "server"]

[[test]]
name = "health_checks"
required-features = ["client", "server"]

[[test]]
name = "partitions"
required-features = ["client", "server"]

[[test]]
name = "results"
required-features = ["client", "server"]

[[test]]
name = "sessions"
required-features = ["client", "server"]

[[test]]
name = "submitter"
required-features = ["client", "server"]

[[test]]
name = "tasks"
required-features = ["client", "server"]

[[test]]
name = "versions"
required-features = ["client", "server"]

[[test]]
name = "worker"
required-features = ["agent", "worker"]

[[bench]]
name = "roundtrip"
required-features = ["client", "server"]
harness = false

[[bench]]
name = "wire"
required-features = ["client", "server"]
harness = false
