[package]
authors = ["Florian Lemaitre <flemaitre@aneo.fr>"]
description = "Internal derive macros for the armonik crate"
edition = "2021"
include = ["**/*.rs", "Cargo.toml", "LICENSE", "README.md"]
license = "Apache-2.0"
readme = "README.md"
name = "armonik-macros"
repository = "https://github.com/aneoconsulting/ArmoniK.Api"
version = "3.29.2-beta-0"
rust-version = "1.88.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
prost = "0.14"
prost-types = "0.14"
# Descriptor-fingerprint hash; the same crate hashes it in armonik's build
# script, so the two sides cannot diverge (see `descriptor::index`).
fnv = "1"
