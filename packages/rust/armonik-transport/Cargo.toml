[package]
name = "armonik-transport"
description = "Transport layer (configuration, TLS/mTLS) for the ArmoniK Rust client"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
include = ["**/*.rs", "Cargo.toml", "README.md"]

[features]
serde = ["dep:serde"]

[dependencies]
# `channel` for `tonic::transport::Endpoint`, which is what `connect` builds; `codegen` for the
# `http`/`tokio_stream` re-exports a dependent reaches through this crate.
tonic = { workspace = true, features = ["channel", "codegen"] }
snafu.workspace = true
tracing.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2"] }
# `client-legacy` for `HttpConnector`, which this crate names: `hyper-rustls` happens to turn it on, and
# depending on that would break the day it stops. Also `client-legacy` for the `Tunnel` connector that
# performs the `CONNECT` handshake. `client-proxy` for the proxy matcher: the `*_PROXY` convention,
# `NO_PROXY` on curl's rules, and taking credentials out of a proxy URL, none of which is worth writing
# again here.
hyper-util = { workspace = true, features = [
  "client",
  "client-legacy",
  "client-proxy",
  "http1",
] }
hyper-rustls = { workspace = true, features = [
  "http1",
  "http2",
  "native-tokio",
  "tls12",
  "logging",
] }
rustls = { workspace = true, features = ["ring", "logging", "std", "tls12"] }
serde = { workspace = true, optional = true }
humantime.workspace = true
# `Proxy-Authorization: Basic` needs it. Already in the tree through `tonic`, so declaring it adds
# nothing to the build.
base64.workspace = true
# The CONNECT handshake writes and reads the socket directly and bounds itself in time; `macros` is
# for the `select!` that races connection attempts, and belongs here rather than in the dev
# dependencies: without it the library does not build, only its tests do.
tokio = { workspace = true, features = ["io-util", "macros", "net", "time"] }
# The proxy connector is a `tower` service, so that it composes with the connectors around it.
tower-service.workspace = true
# Keepalive on a socket this crate opened itself, which `TcpSocket` does not expose.
socket2.workspace = true
# `FuturesUnordered`, to hold several connection attempts in flight at once.
futures-util.workspace = true

# `SO_REUSE_UNICASTPORT` is the only Windows-specific thing here, and the only `unsafe`. Through
# `windows-sys` so that the signature and the constants come from the SDK rather than from us.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
# The boolean options are read straight from the environment, so testing which spellings they accept
# means setting variables: process-global state, hence one test at a time.
serial_test.workspace = true
# Only to round-trip `ClientConfigArgs` in the test that pins the `serde` feature.
serde_json.workspace = true
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "time",
  # A paused clock, so the racing tests assert on scheduling rather than on wall-clock timing.
  "test-util",
] }
# The integration tests serve a gRPC service to call, which the regular build never does; these features
# union with the `channel`/`codegen` above for test builds only.
tonic = { workspace = true, features = ["server", "router"] }
# The test service's codec moves raw `Bytes`; production code here hands whole channels to its caller
# rather than framing messages itself.
bytes.workspace = true
