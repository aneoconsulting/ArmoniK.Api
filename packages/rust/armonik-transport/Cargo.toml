[package]
name = "armonik-transport"
description = "Transport layer (configuration, TLS/mTLS) for the ArmoniK Rust client"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
include = ["**/*.rs", "Cargo.toml", "README.md"]

[features]
serde = ["dep:serde", "dep:serde_with"]
# Environment reading deserialises `HttpConfigArgs`, whose field names are fixed at compile time
# (`#[serde(rename_all = "PascalCase")]`), so it needs the derive `serde` turns on, plus `figment`'s
# own `env` feature for its `Env` provider.
env = ["serde", "dep:figment"]

[dependencies]
# `channel` for `tonic::transport::Endpoint`, which is what `connect` builds; `codegen` for the
# `http`/`tokio_stream` re-exports a dependent reaches through this crate.
tonic = { workspace = true, features = ["channel", "codegen"] }
# `HttpConfigArgs::from_env`'s reader: its `Env` provider supports `#[serde(flatten)]`, and reads a
# `PascalCase` variable correctly (unlike `config`'s `Environment`, which lower-cases a key before any
# case conversion runs, empirically confirmed unusable here).
figment = { workspace = true, optional = true, features = ["env"] }
snafu.workspace = true
tracing.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2"] }
# `client-legacy` for `HttpConnector`, which this crate names: `hyper-rustls` happens to turn it on, and
# depending on that would break the day it stops. Also `client-legacy` for the `Tunnel` connector that
# performs the `CONNECT` handshake. `client-proxy` for the proxy matcher: the `*_PROXY` convention,
# `NO_PROXY` on curl's rules, and taking credentials out of a proxy URL, none of which is worth writing
# again here.
hyper-util = { workspace = true, features = [
  "client",
  "client-legacy",
  "client-proxy",
  "http1",
] }
hyper-rustls = { workspace = true, features = [
  "http1",
  "http2",
  "native-tokio",
  "tls12",
  "logging",
] }
rustls = { workspace = true, features = ["ring", "logging", "std", "tls12"] }
serde = { workspace = true, optional = true }
# `with_prefix!`, for a group of args whose flat names already share a literal prefix (`Tcp*`): it
# composes with `#[serde(flatten)]` to read the same environment variable names as today while
# keeping the option's own definition in its own thematic file. `std` because `with_prefix!` is
# gated behind it.
serde_with = { workspace = true, optional = true, default-features = false, features = ["std"] }
# Reads a client certificate bundled with its key as a PKCS#12 file, the form Windows and most
# certificate authorities hand out; pure Rust, so it does not pull in an OpenSSL of its own.
p12-keystore.workspace = true
humantime.workspace = true
# `Proxy-Authorization: Basic` needs it. Already in the tree through `tonic`, so declaring it adds
# nothing to the build.
base64.workspace = true
# The CONNECT handshake writes and reads the socket directly, and bounds itself in time.
tokio = { workspace = true, features = ["io-util", "net", "time"] }
# The proxy connector is a `tower` service, so that it composes with the connectors around it.
tower-service.workspace = true
# `SecretString`, for `Secret`'s storage: zeroized on drop, which a hand-rolled `String` is not.
secrecy.workspace = true

[dev-dependencies]
# The boolean options are read straight from the environment, so testing which spellings they accept
# means setting variables: process-global state, hence one test at a time.
serial_test.workspace = true
# Only to round-trip `HttpConfigArgs` in the test that pins the `serde` feature.
serde_json.workspace = true
# A real file for the certificate-loading tests to read: a PEM, or a garbage PKCS#12 bundle.
tempfile.workspace = true
# A self-signed certificate and key, generated fresh in the PKCS#12 test rather than committed.
rcgen.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# The integration tests serve a gRPC service to call, which the regular build never does; these features
# union with the `channel`/`codegen` above for test builds only.
tonic = { workspace = true, features = ["server", "router"] }
# The test service's codec moves raw `Bytes`; production code here hands whole channels to its caller
# rather than framing messages itself.
bytes.workspace = true
