[package]
name = "armonik-transport"
description = "Transport layer (configuration, TLS/mTLS) for the ArmoniK Rust client"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
include = ["**/*.rs", "Cargo.toml", "README.md"]

[features]
# `secrecy/serde` so the proxy password deserialises with the rest of the options. There is no
# Serialize half to turn on: the type refuses to be written out.
serde = [
  "dep:serde",
  "secrecy/serde",
  "dep:serde_with",
  "dep:serde_path_to_error",
]
# Reading the options from environment variables, under a prefix the caller chooses. `serde`
# because that is what does the reading; the feature adds no dependency of its own.
env = ["serde"]
# A JSON schema of the option vocabulary, for generating an options class in another language.
# `serde_json` because the prefix helper rewrites the generated schema's property names, and a
# schemars 1.x schema is edited as the JSON value it wraps.
schema = ["serde", "dep:schemars", "dep:serde_json"]

[dependencies]
# The URIs, headers and status types the options are read into, and re-exported so a dependent
# building a `HeaderValue` for `UserAgent` uses the same `http` this crate parsed one with. Declared
# directly rather than reached through `hyper`, which only re-exports part of it.
http.workspace = true
snafu.workspace = true
tracing.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2"] }
# Neither is used by this crate. Both are re-exported, so a dependent that drives an HTTP/2 client
# over this connector reads an `h2::Reason` off a hyper error with the same `h2` hyper raised it
# from, and hands hyper a body hyper accepts. `h2` is already in this crate's tree through `hyper`;
# `http-body-util` is the one crate this adds, and the workspace had already resolved it.
# Default features: `channel` costs a `tokio` edge and belongs to whoever feeds a request body, on
# that crate's own dependency, where the cost is attached to the need.
h2.workspace = true
http-body-util.workspace = true
# `client-legacy` for `HttpConnector` and for the `Tunnel` connector that performs the `CONNECT`
# handshake; `tokio` for `TokioIo` and the runtime side of both. Each is named here even though
# `hyper-rustls` happens to turn it on: depending on that would break the day it stops.
# `client-proxy` for the proxy matcher: the `*_PROXY` convention, `NO_PROXY` on curl's rules, and
# taking credentials out of a proxy URL, none of which is worth writing again here.
# `http1` and `http2` gate the legacy `Client` itself, which exists only if one of them is on, and
# HTTP/2 is what a dependent driving this connector over `reexports::hyper_util` speaks.
hyper-util = { workspace = true, features = [
  "client",
  "client-legacy",
  "client-proxy",
  "http1",
  "http2",
  "tokio",
] }
hyper-rustls = { workspace = true, features = [
  "http1",
  "http2",
  "native-tokio",
  "tls12",
  "logging",
] }
rustls = { workspace = true, features = ["ring", "logging", "std", "tls12"] }
# Reads a certificate bundled with its key as a PKCS#12 file; pure Rust, so it pulls in no OpenSSL
# of its own.
p12-keystore.workspace = true
serde = { workspace = true, optional = true }
# `with_prefix!`, for a group of options whose flat names already share a literal prefix (`Tcp*`,
# `Http2*`): it composes with `#[serde(flatten)]` to read the same names as before the grouping,
# while keeping each option's definition in its own thematic file, under whichever prefix the
# embedding gives it. `std` because `with_prefix!` is gated behind it.
serde_with = { workspace = true, optional = true, features = ["std"] }
# Records which key a `serde` source was reading when a value was refused. Wrapped around the
# deserializer a flattened unit reads through, it recovers the option name that `#[serde(flatten)]`
# otherwise buffers away, so no reader has to be told its own name.
serde_path_to_error = { workspace = true, optional = true }
# The JSON schema of the option vocabulary, behind the `schema` feature.
schemars = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
humantime.workspace = true
# `Proxy-Authorization: Basic` needs it. Already in the tree through `hyper-util`, so declaring it
# adds nothing to the build.
base64.workspace = true
# Decodes percent-escapes in a proxy URL's userinfo. Already resolved in the workspace lockfile
# through another crate's transitive tree, so declaring it directly adds no new crate to the build.
percent-encoding.workspace = true
# `SecretString`, so the proxy password is redacted by `Debug` and zeroized on drop, which a plain
# `String` field is not.
secrecy.workspace = true
# The tunnel handshake is bounded in time, and the tunnel hands back a TCP stream.
tokio = { workspace = true, features = ["net", "time"] }
# The proxy connector is a `tower` service, so that it composes with the connectors around it.
tower-service.workspace = true

[dev-dependencies]
# The unit tests build configurations the way a caller does under the `serde` feature: from a JSON
# document naming the flat options.
serde_json.workspace = true
# A CA-signed certificate and its key, generated fresh for the PKCS#12 tests: `p12-keystore`
# rebuilds a bundle's chain by issuer, so proving the intermediates survive needs material that
# really signed the leaf, which a committed fixture would also have to keep unexpired.
rcgen.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[[example]]
name = "generate_schema"
required-features = ["schema"]
