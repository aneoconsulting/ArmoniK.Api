[workspace]
resolver = "2"
members = ["armonik", "armonik-transport"]

# Shared so that a version bump, or a change of MSRV or licence, is made once rather than drifting per
# crate. Members opt in per field with `xxx.workspace = true`.
[workspace.package]
authors = ["Florian Lemaitre <flemaitre@aneo.fr>"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/aneoconsulting/ArmoniK.Api"
rust-version = "1.88.0"
version = "3.29.2-beta-0"

# Every version lives here, so the two crates cannot resolve to two different `tonic`s, or two
# different `rustls`es, in one build. That matters because they hand each other types from both.
# Members list the dependency and their own features; the version comes from here.
[workspace.dependencies]
# By path and by version at once: a path dependency cannot be published, so `cargo publish` replaces
# it with the version requirement, which therefore has to name the version being released.
# `nr update-versions` keeps it in step.
armonik-transport = { path = "armonik-transport", version = "3.29.2-beta-0" }
async-stream = "0.3.6"
bytes = "1.12.1"
eyre = "0.6.14"
futures = "0.3.34"
http-body-util = "0.1.5"
humantime = "2.4.0"
hyper = "1.11.0"
hyper-rustls = { version = "0.27.9", default-features = false }
hyper-util = "0.1.20"
prost = "0.14.4"
prost-types = "0.14.4"
rustls = { version = "0.23.43", default-features = false }
# `std` as well as `derive`: without it `String` implements neither `Serialize` nor `Deserialize`, so
# the `serde` feature would not compile.
serde = { version = "1.0.229", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
serial_test = "3.5"
snafu = "0.9.2"
tokio = { version = "1.53.1", default-features = false }
tokio-util = "0.7.19"
tonic = { version = "0.14.6", default-features = false }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower-service = "0.3.3"
tracing = "0.1.44"
tracing-futures = "0.2.5"
tracing-subscriber = "0.3.23"
